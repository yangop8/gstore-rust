[package]
name = "gstore"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A Rust rewrite of the gStore RDF triple store / graph database (https://github.com/pkumod/gStore)"
license = "BSD-3-Clause"
repository = "https://github.com/yangop8/gstore-rust"

# The gNLQA natural-language QA orchestrator lives in its own crate so its
# heavier deps (HTTPS client for the LLM API, JSON) stay out of the lean gStore
# crate. Cargo isolates per-crate deps, so `cargo build -p gstore` is unaffected.
[workspace]
members = ["gnlqa"]

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1"
# Used only by the SPARQL REGEX builtin and string/replace functions.
regex = "1"
# Optional persistent storage backend. OFF by default (keeps the build
# dependency-light and avoids compiling bundled librocksdb C++). Enable with
# `--features rocksdb` to get the `RocksStore` / Rocks-backed `Database`.
rocksdb = { version = "0.22", optional = true }
# Optional HTTP response compression for the bundled servers (see the `gzip`
# feature). OFF by default so the base crate stays dependency-free; `flate2`'s
# default backend is the pure-Rust `miniz_oxide` (no C toolchain needed).
flate2 = { version = "1", optional = true }
# Optional TLS for the bundled servers (see the `tls` feature). OFF by default.
# `default-features = false` + `ring` selects the pure-ring crypto backend so we
# do not pull in `aws-lc-rs`/bindgen; `rustls-pemfile` loads the cert + key PEM.
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = { version = "2", optional = true }
# Optional line editing for `gconsole` (see the `readline` feature). OFF by
# default: the default console reads plain lines. No default features: the
# console keeps its own history file and needs no home-dir/file-lock helpers.
rustyline = { version = "19", optional = true, default-features = false }

[features]
# Persistent RocksDB storage backend (see `src/backend/rocks.rs`).
rocksdb = ["dep:rocksdb"]
# gzip/deflate compression of buffered HTTP responses when the client sends a
# matching `Accept-Encoding` (see `src/server.rs::write_response_maybe_gzip`).
gzip = ["dep:flate2"]
# HTTPS/TLS listeners for the bundled `Server` / `ApiServer` (see the
# `serve_forever_tls` methods and `load_tls_config` in `src/server.rs`).
tls = ["dep:rustls", "dep:rustls-pemfile"]
# `gconsole` line editing: arrow keys / Emacs keys, history recall and tab
# completion of command and database names (see `src/console/mod.rs`).
readline = ["dep:rustyline"]

[dev-dependencies]

[lib]
name = "gstore"
path = "src/lib.rs"

[[bin]]
name = "gbuild"
path = "src/bin/gbuild.rs"

[[bin]]
name = "gquery"
path = "src/bin/gquery.rs"

[[bin]]
name = "gconsole"
path = "src/bin/gconsole.rs"

[[bin]]
name = "gserver"
path = "src/bin/gserver.rs"

[[bin]]
name = "gnode"
path = "src/bin/gnode.rs"

[[bin]]
name = "gadd"
path = "src/bin/gadd.rs"

[[bin]]
name = "gsub"
path = "src/bin/gsub.rs"

[[bin]]
name = "gdrop"
path = "src/bin/gdrop.rs"

[[bin]]
name = "gshow"
path = "src/bin/gshow.rs"

[[bin]]
name = "gbackup"
path = "src/bin/gbackup.rs"

[[bin]]
name = "grestore"
path = "src/bin/grestore.rs"

[[bin]]
name = "gexport"
path = "src/bin/gexport.rs"

[[bin]]
name = "gmonitor"
path = "src/bin/gmonitor.rs"

# ---- packaging (see docs/DEPLOY.md) -----------------------------------------
# `cargo deb` (cargo-deb) and `cargo generate-rpm` (cargo-generate-rpm) build
# .deb / .rpm packages from a release build: the binaries in /usr/bin, the
# configuration in /etc/gstore, the systemd unit, the gstore system user
# (sysusers.d) and its working directory /var/lib/gstore (tmpfiles.d).
[package.metadata.deb]
name = "gstore"
maintainer = "gstore-rust maintainers <https://github.com/yangop8/gstore-rust/issues>"
copyright = "gstore-rust contributors; gStore (c) PKUMOD, Peking University (BSD-3-Clause)"
extended-description = """\
gstore-rust is a Rust rewrite of gStore, an RDF triple store / graph database \
answering SPARQL queries by subgraph matching. This package provides gserver, \
an HTTP server speaking upstream gStore 1.4's /api protocol (run as the gserver \
systemd service), the gconsole client and the command-line tools gbuild, \
gquery, gadd, gsub, gdrop, gshow, gbackup, grestore, gexport, gmonitor and gnode."""
section = "database"
priority = "optional"
depends = "$auto, adduser"
conf-files = ["/etc/gstore/conf.ini"]
maintainer-scripts = "packaging/debian/"
assets = [
    ["target/release/gserver", "usr/bin/", "755"],
    ["target/release/gconsole", "usr/bin/", "755"],
    ["target/release/gbuild", "usr/bin/", "755"],
    ["target/release/gquery", "usr/bin/", "755"],
    ["target/release/gadd", "usr/bin/", "755"],
    ["target/release/gsub", "usr/bin/", "755"],
    ["target/release/gdrop", "usr/bin/", "755"],
    ["target/release/gshow", "usr/bin/", "755"],
    ["target/release/gbackup", "usr/bin/", "755"],
    ["target/release/grestore", "usr/bin/", "755"],
    ["target/release/gexport", "usr/bin/", "755"],
    ["target/release/gmonitor", "usr/bin/", "755"],
    ["target/release/gnode", "usr/bin/", "755"],
    ["conf/conf.ini.example", "etc/gstore/conf.ini", "640"],
    ["conf/slog.properties.example", "etc/gstore/slog.properties.example", "644"],
    ["conf/slog.stdout.properties.example", "etc/gstore/slog.stdout.properties.example", "644"],
    ["packaging/systemd/gserver.service", "lib/systemd/system/gserver.service", "644"],
    ["packaging/sysusers/gstore.conf", "usr/lib/sysusers.d/gstore.conf", "644"],
    ["packaging/tmpfiles/gstore.conf", "usr/lib/tmpfiles.d/gstore.conf", "644"],
    ["docs/DEPLOY.md", "usr/share/doc/gstore/DEPLOY.md", "644"],
    ["README.md", "usr/share/doc/gstore/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "gstore"
summary = "gStore RDF graph database (Rust rewrite): gserver and command-line tools"
post_install_script = "packaging/rpm/post_install.sh"
pre_uninstall_script = "packaging/rpm/pre_uninstall.sh"
assets = [
    { source = "target/release/gserver", dest = "/usr/bin/gserver", mode = "755" },
    { source = "target/release/gconsole", dest = "/usr/bin/gconsole", mode = "755" },
    { source = "target/release/gbuild", dest = "/usr/bin/gbuild", mode = "755" },
    { source = "target/release/gquery", dest = "/usr/bin/gquery", mode = "755" },
    { source = "target/release/gadd", dest = "/usr/bin/gadd", mode = "755" },
    { source = "target/release/gsub", dest = "/usr/bin/gsub", mode = "755" },
    { source = "target/release/gdrop", dest = "/usr/bin/gdrop", mode = "755" },
    { source = "target/release/gshow", dest = "/usr/bin/gshow", mode = "755" },
    { source = "target/release/gbackup", dest = "/usr/bin/gbackup", mode = "755" },
    { source = "target/release/grestore", dest = "/usr/bin/grestore", mode = "755" },
    { source = "target/release/gexport", dest = "/usr/bin/gexport", mode = "755" },
    { source = "target/release/gmonitor", dest = "/usr/bin/gmonitor", mode = "755" },
    { source = "target/release/gnode", dest = "/usr/bin/gnode", mode = "755" },
    { source = "conf/conf.ini.example", dest = "/etc/gstore/conf.ini", mode = "640", config = "noreplace" },
    { source = "conf/slog.properties.example", dest = "/etc/gstore/slog.properties.example", mode = "644" },
    { source = "conf/slog.stdout.properties.example", dest = "/etc/gstore/slog.stdout.properties.example", mode = "644" },
    { source = "packaging/systemd/gserver.service", dest = "/usr/lib/systemd/system/gserver.service", mode = "644" },
    { source = "packaging/sysusers/gstore.conf", dest = "/usr/lib/sysusers.d/gstore.conf", mode = "644" },
    { source = "packaging/tmpfiles/gstore.conf", dest = "/usr/lib/tmpfiles.d/gstore.conf", mode = "644" },
    { source = "docs/DEPLOY.md", dest = "/usr/share/doc/gstore/DEPLOY.md", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/gstore/README.md", mode = "644", doc = true },
]

[profile.release]
opt-level = 3
lto = "thin"

# Keep test/dev builds reasonably fast while still exercising real code paths.
[profile.test]
opt-level = 1
